# 地址: https://github.com/Jarv1s0/Proxy_Script
# 版本: v4.0.0
# 更新: 2026 年 5 月 26 日

# ==================== 核心配置 ====================
mixed-port: 7890
allow-lan: true
ipv6: false
mode: rule
log-level: info
bind-address: '*'
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 60
find-process-mode: strict
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'
# ==================== TUN 模式 ====================
tun:
  enable: true
  stack: mips
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack: ['any:53', 'tcp://any:53']
# ==================== DNS 配置 ====================
# 国内外 DNS 定义
chinaDNS: &chinaDNS ['223.5.5.5#DIRECT', '119.29.29.29#DIRECT']
foreignDNS: &foreignDNS ['https://cloudflare-dns.com/dns-query#Proxy', 'https://dns.google/dns-query#Proxy']
defaultDNS: &defaultDNS ['114.114.114.114#DIRECT', 'tls://223.5.5.5#DIRECT', 'https://1.12.12.12/dns-query#DIRECT']
proxyServerDNS: &proxyServerDNS ['114.114.114.114#DIRECT', 'tls://223.5.5.5#DIRECT', 'https://doh.pub/dns-query#DIRECT']

dns:
  enable: true
  ipv6: false
  use-hosts: true
  cache-algorithm: arc
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/15
  fake-ip-filter: ['rule-set:private', 'rule-set:fakeip_filter', 'rule-set:china']
  default-nameserver: *defaultDNS
  proxy-server-nameserver: *proxyServerDNS
  nameserver: *foreignDNS
  nameserver-policy:
    'rule-set:private': 'system'
    'rule-set:china': *chinaDNS
  direct-nameserver: *chinaDNS
  direct-nameserver-follow-policy: true

hosts:
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'cloudflare-dns.com': ['1.1.1.1', '1.0.0.1']
  'dns.google': ['8.8.8.8', '8.8.4.4']

  # 解决谷歌商店无法下载的问题
  'services.googleapis.cn': 'services.googleapis.com'

  # 屏蔽哔哩哔哩PCDN，解决访问视频卡顿/直播问题
  '+.mcdn.bilivideo.com': ['0.0.0.0']
  '+.mcdn.bilivideo.cn': ['0.0.0.0']
  '+.edge.mountaintoys.cn': ['0.0.0.0']
  '+.h2.smtcdns.net': ['0.0.0.0']

# ==================== 代理策略组 ====================
proxy-groups:
  - { name: Proxy, type: select, include-all: true }

# ==================== 规则集 ====================
BehaviorDN: &BehaviorDN { type: http, behavior: domain, format: mrs, interval: 86400 }
BehaviorIP: &BehaviorIP { type: http, behavior: ipcidr, format: mrs, interval: 86400 }

rule-providers:
  # 域名规则
  tracking:       { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Tracking.mrs }
  advertising:    { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Advertising.mrs }
  direct:         { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Direct.mrs }
  private:        { <<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/private.mrs }
  download:       { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Download.mrs }
  fakeip_filter:  { <<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/fakeip-filter.mrs }
  ai:             { <<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/category-ai-!cn.mrs }
  github:         { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/GitHub.mrs }
  telegram:       { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Telegram.mrs }
  steamcn:        { <<: *BehaviorDN, url: https://github.com/Jarv1s0/RuleList/raw/release/rules/SteamCN.mrs }
  games:          { <<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/category-games@cn.mrs }
  youtube:        { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/YouTube.mrs }
  applecn:        { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AppleCN.mrs }
  googlecn:       { <<: *BehaviorDN, url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/google-cn.mrs }
  google:         { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Google.mrs }
  microsoftcn:    { <<: *BehaviorDN, url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/microsoft-cn.mrs }
  gfw:            { <<: *BehaviorDN, url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/gfw.mrs }
  proxy:          { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Proxy.mrs }
  china:          { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs }

  # IP规则
  privateip:      { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Private.mrs }
  aiip:           { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/AI.mrs }
  telegramip:     { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Telegram.mrs }
  googleip:       { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Google.mrs }
  proxyip:        { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Proxy.mrs }
  chinaip:        { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/China.mrs }

# ==================== 规则路由 ====================
rules:
  # 自定义规则
  - DOMAIN-KEYWORD,1ytsub,DIRECT
  - DOMAIN-KEYWORD,jarv1s,Proxy
  - PROCESS-NAME,dota2.exe,DIRECT
  - PROCESS-NAME,language_server_windows_x64.exe,Proxy
  - PROCESS-NAME,Antigravity.exe,Proxy

  # 拦截规则
  - RULE-SET,tracking,REJECT
  - RULE-SET,advertising,REJECT
  #- OR,((AND,((DST-PORT,443),(NETWORK,UDP),(NOT,((GEOIP,CN))))),(DST-PORT,853)),REJECT

  # 域名规则
  - RULE-SET,private,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,steamcn,DIRECT
  - RULE-SET,download,DIRECT
  - RULE-SET,applecn,DIRECT
  - RULE-SET,microsoftcn,DIRECT
  - RULE-SET,ai,Proxy
  - RULE-SET,github,Proxy
  - RULE-SET,telegram,Proxy
  - RULE-SET,games,Proxy
  - RULE-SET,youtube,Proxy
  - RULE-SET,googlecn,DIRECT
  - RULE-SET,google,Proxy
  - RULE-SET,gfw,Proxy
  - RULE-SET,proxy,Proxy
  - RULE-SET,china,DIRECT

  # IP规则
  - RULE-SET,privateip,DIRECT,no-resolve
  - RULE-SET,aiip,Proxy,no-resolve
  - RULE-SET,telegramip,Proxy,no-resolve
  - RULE-SET,googleip,Proxy,no-resolve
  - RULE-SET,proxyip,Proxy,no-resolve
  - RULE-SET,chinaip,DIRECT,no-resolve

  # 兜底规则
  - MATCH,Proxy
