# 地址: https://github.com/Jarv1s0/Proxy_Script
# 版本: v4.0.0
# 更新: 2026 年 5 月 26 日

# ==================== 核心配置 ====================
mixed-port: 7890
allow-lan: true
ipv6: false
mode: rule
log-level: info
bind-address: '*'
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 60
find-process-mode: strict
external-controller: '127.0.0.1:9090'
external-ui: ui
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'
# ==================== TUN 模式 ====================
tun:
  enable: true
  stack: mips
  auto-route: true
  strict-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack: ['any:53', 'tcp://any:53']
# ==================== DNS 配置 ====================
dns:
  # 启用内置 DNS。
  enable: true
  # DNS 上游连接遵循分流规则；需要同时配置 proxy-server-nameserver。
  respect-rules: true
  # 不返回 IPv6 地址，保持当前 IPv4 配置。
  ipv6: false
  # 默认返回 Fake-IP，由内核在连接时识别域名并分流。
  enhanced-mode: fake-ip
  # 分配给 Fake-IP 的 IPv4 地址池。
  fake-ip-range: 198.18.0.1/16

  # 引导 DNS：解析 dns.alidns.com、doh.pub 等 DNS 上游自身的域名。
  # 纯 IP 写法默认使用 UDP 53，不是网站域名的主要解析入口。
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6

  # 默认域名解析：使用阿里和腾讯 DoH；连接走向由分流规则决定。
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"

  # 专门解析代理节点服务器的域名，避免节点解析依赖尚未建立的代理。
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"

  # 以下规则集命中的域名返回真实 IP，不分配 Fake-IP。
  # 此处仅控制 DNS 应答形式，是否直连仍由 rules 决定。
  fake-ip-filter:
    - rule-set:direct
    - rule-set:private
    - rule-set:china
    - rule-set:fakeip_filter

hosts:
  # 解决谷歌商店无法下载的问题
  'services.googleapis.cn': 'services.googleapis.com'

  # 屏蔽哔哩哔哩PCDN，解决访问视频卡顿/直播问题
  '+.mcdn.bilivideo.com': ['0.0.0.0']
  '+.mcdn.bilivideo.cn': ['0.0.0.0']
  '+.edge.mountaintoys.cn': ['0.0.0.0']
  '+.h2.smtcdns.net': ['0.0.0.0']

# ==================== 实验性功能 ====================
experimental:
  quic-go-disable-gso: true

# ==================== 配置存储 ====================
profile:
  store-selected: true
  store-fake-ip: true

# ==================== 流量嗅探 ====================
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ==================== 锚点配置 ====================
UrlTest: &UrlTest { type: url-test, interval: 300, tolerance: 50, lazy: true, url: 'https://www.gstatic.com/generate_204', empty-fallback: REJECT, hidden: true, include-all: true, max-failed-times: 3 }
Select: &Select { type: select, hidden: false, include-all: true }
Global_settings: { exclude_regex: &global_exclude "(?i)AHK|排除1|排除2|5x|倍率|剩余流量|过期|回国|群|官网|客服|订阅|流量|套餐|到期|Expire|Traffic|频道|邀请|TG|测试|Test" }

filters:
  - &FilterHK '(?i)(?:港|香港|🇭🇰|\bHK\b|\bHKG\b|Hong\s*Kong)'
  - &FilterTW '(?i)(?:台|臺|台湾|台灣|🇹🇼|\bTW\b|\bTWN\b|\bTaiwan\b|\bTaipei\b|\bTPE\b|\bTSA\b|\bKHH\b)'
  - &FilterJP '(?i)(?:日|日本|东京|大阪|🇯🇵|\bJP\b|\bJPN\b|\bJapan\b|\bTokyo\b|\bOsaka\b|\bNRT\b|\bHND\b|\bKIX\b|\bCTS\b|\bFUK\b)'
  - &FilterSG '(?i)(?:坡|新加坡|狮城|🇸🇬|\bSG\b|\bSGP\b|\bSIN\b|\bXSP\b|Singapore)'
  - &FilterUS '(?i)(?:美国|美國|美东|美東|美西|美中|美南|美港|美日|中美|美专|美專|🇺🇸|\bUS\b|\bUSA\b|\bUnited\s*States\b|\bAmerica\b|\bSJC\b|\bJFK\b|\bLAX\b|\bORD\b|\bSFO\b|\bSEA\b|\bIAD\b|\bEWR\b)'
  - &FilterKR '(?i)(?:韩|韓|韩国|韓國|首尔|首爾|🇰🇷|\bKR\b|\bKOR\b|\bKorea\b|\bSeoul\b|\bICN\b)'

# ==================== 代理策略组 ====================
proxy-groups:
  # --- 顶层业务分组 ---
  - { name: Proxy, type: select, proxies: [Fallback, 香港, 台湾, 日本, 新加坡, 美国, 韩国, DIRECT], icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Rocket.png }
  - { name: Google, type: select, proxies: [美国, 香港, 台湾, 日本, 新加坡, 韩国], icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Google_Search.png }
  - { name: YouTube, type: select, proxies: [美国, 香港, 台湾, 日本, 新加坡, 韩国], icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/YouTube.png }
  - { name: AI, type: select, proxies: [美国, 新加坡, 日本, 香港, 台湾], icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/AI.png }
  - { name: Games, type: select, proxies: [香港, 台湾, 日本, 新加坡, 美国, DIRECT], icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Steam.png }
  - { name: GitHub, type: select, proxies: [香港, 台湾, 日本, 新加坡, 美国, 韩国], icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/GitHub.png }
  - { name: Telegram, type: select, proxies: [香港, 台湾, 日本, 新加坡, 美国, 韩国], icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Telegram.png }
  - { name: Fallback, type: fallback, url: 'https://www.gstatic.com/generate_204', interval: 300, hidden: true, proxies: [香港, 新加坡, 日本, 台湾, 美国], icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/ULB.png }

  # --- 底层地区筛选组 ---
  - { name: 香港, <<: *UrlTest, filter: *FilterHK, exclude-filter: *global_exclude, icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Hong_Kong.png }
  - { name: 台湾, <<: *UrlTest, filter: *FilterTW, exclude-filter: *global_exclude, icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Taiwan.png }
  - { name: 日本, <<: *UrlTest, filter: *FilterJP, exclude-filter: *global_exclude, icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Japan.png }
  - { name: 新加坡, <<: *UrlTest, filter: *FilterSG, exclude-filter: *global_exclude, icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Singapore.png }
  - { name: 韩国, <<: *UrlTest, filter: *FilterKR, exclude-filter: *global_exclude, icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Korea.png }
  - { name: 美国, <<: *Select, filter: *FilterUS, exclude-filter: *global_exclude, icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/United_States.png }
  - { name: ALL, type: select, include-all: true, exclude-filter: *global_exclude, icon: https://cdn.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Global.png }

# ==================== 规则集 ====================
BehaviorDN: &BehaviorDN { type: http, behavior: domain, format: mrs, interval: 86400 }
BehaviorIP: &BehaviorIP { type: http, behavior: ipcidr, format: mrs, interval: 86400 }

rule-providers:
  # 域名规则
  tracking:       { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Tracking.mrs }
  advertising:    { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Advertising.mrs }
  direct:         { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Direct.mrs }
  private:        { <<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/private.mrs }
  download:       { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Download.mrs }
  fakeip_filter:  { <<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/fakeip-filter.mrs }
  ai:             { <<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/category-ai-!cn.mrs }
  github:         { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/GitHub.mrs }
  telegram:       { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Telegram.mrs }
  steamcn:        { <<: *BehaviorDN, url: https://github.com/Jarv1s0/RuleList/raw/release/rules/SteamCN.mrs }
  games:          { <<: *BehaviorDN, url: https://fastly.jsdelivr.net/gh/appshubcc/bett-rules@meta/geo/geosite/category-games@cn.mrs }
  youtube:        { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/YouTube.mrs }
  applecn:        { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/AppleCN.mrs }
  google:         { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Google.mrs }
  microsoft:      { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Microsoft.mrs }
  gfw:            { <<: *BehaviorDN, url: https://github.com/DustinWin/ruleset_geodata/releases/download/mihomo-ruleset/gfw.mrs }
  proxy:          { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/Proxy.mrs }
  china:          { <<: *BehaviorDN, url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs }

  # IP规则
  privateip:      { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Private.mrs }
  aiip:           { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/AI.mrs }
  telegramip:     { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Telegram.mrs }
  googleip:       { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Google.mrs }
  proxyip:        { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/Proxy.mrs }
  chinaip:        { <<: *BehaviorIP, url: https://github.com/666OS/rules/raw/release/mihomo/ip/China.mrs }

# ==================== 规则路由 ====================
rules:
  # 拦截规则
  - RULE-SET,tracking,REJECT
  - RULE-SET,advertising,REJECT

  # 域名规则
  - RULE-SET,private,DIRECT
  - RULE-SET,direct,DIRECT
  - RULE-SET,steamcn,DIRECT
  - RULE-SET,download,DIRECT
  - RULE-SET,applecn,DIRECT
  - RULE-SET,ai,AI
  - RULE-SET,github,GitHub
  - RULE-SET,telegram,Telegram
  - RULE-SET,games,Games
  - RULE-SET,youtube,YouTube
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,google,Google
  - RULE-SET,gfw,Proxy
  - RULE-SET,proxy,Proxy
  - RULE-SET,china,DIRECT

  # IP规则
  - RULE-SET,privateip,DIRECT,no-resolve
  - RULE-SET,aiip,AI,no-resolve
  - RULE-SET,telegramip,Telegram,no-resolve
  - RULE-SET,googleip,Google,no-resolve
  - RULE-SET,proxyip,Proxy,no-resolve
  - RULE-SET,chinaip,DIRECT,no-resolve

  # 兜底规则
  - MATCH,Proxy
